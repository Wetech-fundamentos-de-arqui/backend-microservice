# Spring Application data
spring.application.name=iam-service
server.port=8081
documentation.application.description=WeRide IAM: accounts, sign-in and sessions.
documentation.application.version=1.0

# Spring DataSource Configuration (values come from environment variables)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Schema is owned by Flyway; Hibernate only checks it matches the entities
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.example.backendweride.platform.shared.infraestructure.persistence.jpa.strategy.SnakeCasePhysicalNamingStrategy

# Error responses: message yes, stack trace never
server.error.include-message=always
server.error.include-stacktrace=never

# iam keeps its own chain (public sign-in/sign-up) instead of the shared one
weride.security.shared=false

# JWT: RS256, iam signs with the private key and every service verifies with the public one (PEM files from the environment)
spring.security.oauth2.resourceserver.jwt.public-key-location=${JWT_PUBLIC_KEY_LOCATION}
spring.security.oauth2.resourceserver.jwt.issuer-uri=weride-iam
spring.security.oauth2.resourceserver.jwt.audiences=weride-api
weride.iam.jwt.private-key-location=${JWT_PRIVATE_KEY_LOCATION}
authorization.jwt.expiration.days=7

# Internal API (/internal/v1/**): one secret per calling service
weride.internal.callers.api-gateway=${INTERNAL_SECRET_API_GATEWAY_TO_IAM}

# This service as a caller, and the services iam calls for the account deletion workflow (ADR-008).
# A target without url is "not configured": its steps stay PENDING.
weride.internal.service-name=iam
weride.internal.targets.booking.url=${BOOKING_BASE_URL:}
weride.internal.targets.booking.secret=${INTERNAL_SECRET_IAM_TO_BOOKING:}
weride.internal.targets.profile.url=${PROFILE_BASE_URL:}
weride.internal.targets.profile.secret=${INTERNAL_SECRET_IAM_TO_PROFILE:}
weride.internal.targets.garage.url=${GARAGE_BASE_URL:}
weride.internal.targets.garage.secret=${INTERNAL_SECRET_IAM_TO_GARAGE:}
weride.internal.targets.ride.url=${RIDE_BASE_URL:}
weride.internal.targets.ride.secret=${INTERNAL_SECRET_IAM_TO_RIDE:}
weride.internal.targets.notification.url=${NOTIFICATION_BASE_URL:}
weride.internal.targets.notification.secret=${INTERNAL_SECRET_IAM_TO_NOTIFICATION:}

# Health for compose / probes
management.endpoints.web.exposure.include=health
