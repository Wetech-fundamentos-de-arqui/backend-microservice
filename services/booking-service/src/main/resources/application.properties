# Spring Application data
spring.application.name=booking-service
server.port=8085
documentation.application.description=WeRide booking.
documentation.application.version=1.0

# Spring DataSource Configuration (values come from environment variables)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Schema is owned by Flyway; Hibernate only checks it matches the entities
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.example.backendweride.platform.shared.infraestructure.persistence.jpa.strategy.SnakeCasePhysicalNamingStrategy

# Error responses: message yes, stack trace never
server.error.include-message=always
server.error.include-stacktrace=never


spring.security.oauth2.resourceserver.jwt.public-key-location=${JWT_PUBLIC_KEY_LOCATION}
spring.security.oauth2.resourceserver.jwt.issuer-uri=weride-iam
spring.security.oauth2.resourceserver.jwt.audiences=weride-api
management.endpoints.web.exposure.include=health
weride.internal.service-name=booking
weride.internal.callers.iam=${INTERNAL_SECRET_IAM_TO_BOOKING}
weride.internal.callers.ride=${INTERNAL_SECRET_RIDE_TO_BOOKING}
weride.internal.callers.garage=${INTERNAL_SECRET_GARAGE_TO_BOOKING}
weride.internal.callers.ops=${INTERNAL_SECRET_OPS_TO_BOOKING}
weride.internal.targets.garage.url=${GARAGE_BASE_URL:http://localhost:8083}
weride.internal.targets.garage.secret=${INTERNAL_SECRET_BOOKING_TO_GARAGE}
weride.internal.targets.location.url=${LOCATION_BASE_URL:http://localhost:8084}
weride.internal.targets.location.secret=${INTERNAL_SECRET_BOOKING_TO_LOCATION}
weride.internal.targets.ride.url=${RIDE_BASE_URL:http://localhost:8086}
weride.internal.targets.ride.secret=${INTERNAL_SECRET_BOOKING_TO_RIDE}
weride.internal.targets.notification.url=${NOTIFICATION_BASE_URL:http://localhost:8088}
weride.internal.targets.notification.secret=${INTERNAL_SECRET_BOOKING_TO_NOTIFICATION}
