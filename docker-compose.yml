# Local reproducible environment. All published ports bind only to localhost.
x-java-service: &java-service
  restart: unless-stopped
  networks: [app-net]
  mem_limit: 512m
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://localhost:$$SERVER_PORT/actuator/health | grep -q UP"]
    interval: 10s
    timeout: 5s
    retries: 24
    start_period: 60s

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    mem_limit: 768m
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
      DB_PASSWORD_IAM: ${DB_PASSWORD_IAM:?}
      DB_PASSWORD_PROFILE: ${DB_PASSWORD_PROFILE:?}
      DB_PASSWORD_GARAGE: ${DB_PASSWORD_GARAGE:?}
      DB_PASSWORD_LOCATION: ${DB_PASSWORD_LOCATION:?}
      DB_PASSWORD_BOOKING: ${DB_PASSWORD_BOOKING:?}
      DB_PASSWORD_RIDE: ${DB_PASSWORD_RIDE:?}
      DB_PASSWORD_PLAN: ${DB_PASSWORD_PLAN:?}
      DB_PASSWORD_NOTIFICATION: ${DB_PASSWORD_NOTIFICATION:?}
    ports: ["127.0.0.1:3307:3306"]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init-schemas.sh:/docker-entrypoint-initdb.d/init-schemas.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 40
    networks: [app-net]

  iam-service:
    <<: *java-service
    build:
      context: .
      args: {MODULE: services/iam-service}
    depends_on:
      mysql: {condition: service_healthy}
    environment:
      SERVER_PORT: 8081
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60 -XX:InitialRAMPercentage=15
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/weride_iam?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: weride_iam
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD_IAM:?}
      JWT_PUBLIC_KEY_LOCATION: file:/run/secrets/jwt_public
      JWT_PRIVATE_KEY_LOCATION: file:/run/secrets/jwt_private
      INTERNAL_SECRET_API_GATEWAY_TO_IAM: ${INTERNAL_SECRET_API_GATEWAY_TO_IAM:?}
      BOOKING_BASE_URL: http://booking-service:8085
      INTERNAL_SECRET_IAM_TO_BOOKING: ${INTERNAL_SECRET_IAM_TO_BOOKING:?}
      PROFILE_BASE_URL: http://profile-service:8082
      INTERNAL_SECRET_IAM_TO_PROFILE: ${INTERNAL_SECRET_IAM_TO_PROFILE:?}
      GARAGE_BASE_URL: http://garage-service:8083
      INTERNAL_SECRET_IAM_TO_GARAGE: ${INTERNAL_SECRET_IAM_TO_GARAGE:?}
      RIDE_BASE_URL: http://ride-service:8086
      INTERNAL_SECRET_IAM_TO_RIDE: ${INTERNAL_SECRET_IAM_TO_RIDE:?}
      NOTIFICATION_BASE_URL: http://notification-service:8088
      INTERNAL_SECRET_IAM_TO_NOTIFICATION: ${INTERNAL_SECRET_IAM_TO_NOTIFICATION:?}
    secrets: [jwt_public, jwt_private]
    ports: ["127.0.0.1:8081:8081"]

  profile-service:
    <<: *java-service
    build:
      context: .
      args: {MODULE: services/profile-service}
    depends_on:
      mysql: {condition: service_healthy}
    environment:
      SERVER_PORT: 8082
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60 -XX:InitialRAMPercentage=15
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/weride_profile?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: weride_profile
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD_PROFILE:?}
      JWT_PUBLIC_KEY_LOCATION: file:/run/secrets/jwt_public
      INTERNAL_SECRET_IAM_TO_PROFILE: ${INTERNAL_SECRET_IAM_TO_PROFILE:?}
    secrets: [jwt_public]
    ports: ["127.0.0.1:8082:8082"]

  garage-service:
    <<: *java-service
    build:
      context: .
      args: {MODULE: services/garage-service}
    depends_on:
      mysql: {condition: service_healthy}
    environment:
      SERVER_PORT: 8083
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60 -XX:InitialRAMPercentage=15
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/weride_garage?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: weride_garage
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD_GARAGE:?}
      JWT_PUBLIC_KEY_LOCATION: file:/run/secrets/jwt_public
      INTERNAL_SECRET_IAM_TO_GARAGE: ${INTERNAL_SECRET_IAM_TO_GARAGE:?}
      INTERNAL_SECRET_BOOKING_TO_GARAGE: ${INTERNAL_SECRET_BOOKING_TO_GARAGE:?}
      INTERNAL_SECRET_RIDE_TO_GARAGE: ${INTERNAL_SECRET_RIDE_TO_GARAGE:?}
      BOOKING_BASE_URL: http://booking-service:8085
      INTERNAL_SECRET_GARAGE_TO_BOOKING: ${INTERNAL_SECRET_GARAGE_TO_BOOKING:?}
    secrets: [jwt_public]
    ports: ["127.0.0.1:8083:8083"]

  location-service:
    <<: *java-service
    build:
      context: .
      args: {MODULE: services/location-service}
    depends_on:
      mysql: {condition: service_healthy}
    environment:
      SERVER_PORT: 8084
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60 -XX:InitialRAMPercentage=15
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/weride_location?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: weride_location
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD_LOCATION:?}
      JWT_PUBLIC_KEY_LOCATION: file:/run/secrets/jwt_public
      INTERNAL_SECRET_BOOKING_TO_LOCATION: ${INTERNAL_SECRET_BOOKING_TO_LOCATION:?}
    secrets: [jwt_public]
    ports: ["127.0.0.1:8084:8084"]

  booking-service:
    <<: *java-service
    build:
      context: .
      args: {MODULE: services/booking-service}
    depends_on:
      mysql: {condition: service_healthy}
    environment:
      SERVER_PORT: 8085
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60 -XX:InitialRAMPercentage=15
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/weride_booking?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: weride_booking
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD_BOOKING:?}
      JWT_PUBLIC_KEY_LOCATION: file:/run/secrets/jwt_public
      INTERNAL_SECRET_IAM_TO_BOOKING: ${INTERNAL_SECRET_IAM_TO_BOOKING:?}
      INTERNAL_SECRET_RIDE_TO_BOOKING: ${INTERNAL_SECRET_RIDE_TO_BOOKING:?}
      INTERNAL_SECRET_GARAGE_TO_BOOKING: ${INTERNAL_SECRET_GARAGE_TO_BOOKING:?}
      INTERNAL_SECRET_OPS_TO_BOOKING: ${INTERNAL_SECRET_OPS_TO_BOOKING:?}
      GARAGE_BASE_URL: http://garage-service:8083
      INTERNAL_SECRET_BOOKING_TO_GARAGE: ${INTERNAL_SECRET_BOOKING_TO_GARAGE:?}
      LOCATION_BASE_URL: http://location-service:8084
      INTERNAL_SECRET_BOOKING_TO_LOCATION: ${INTERNAL_SECRET_BOOKING_TO_LOCATION:?}
      RIDE_BASE_URL: http://ride-service:8086
      INTERNAL_SECRET_BOOKING_TO_RIDE: ${INTERNAL_SECRET_BOOKING_TO_RIDE:?}
      NOTIFICATION_BASE_URL: http://notification-service:8088
      INTERNAL_SECRET_BOOKING_TO_NOTIFICATION: ${INTERNAL_SECRET_BOOKING_TO_NOTIFICATION:?}
    secrets: [jwt_public]
    ports: ["127.0.0.1:8085:8085"]

  ride-service:
    <<: *java-service
    build:
      context: .
      args: {MODULE: services/ride-service}
    depends_on:
      mysql: {condition: service_healthy}
    environment:
      SERVER_PORT: 8086
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60 -XX:InitialRAMPercentage=15
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/weride_ride?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: weride_ride
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD_RIDE:?}
      JWT_PUBLIC_KEY_LOCATION: file:/run/secrets/jwt_public
      INTERNAL_SECRET_IAM_TO_RIDE: ${INTERNAL_SECRET_IAM_TO_RIDE:?}
      INTERNAL_SECRET_BOOKING_TO_RIDE: ${INTERNAL_SECRET_BOOKING_TO_RIDE:?}
      INTERNAL_SECRET_OPS_TO_RIDE: ${INTERNAL_SECRET_OPS_TO_RIDE:?}
      BOOKING_BASE_URL: http://booking-service:8085
      INTERNAL_SECRET_RIDE_TO_BOOKING: ${INTERNAL_SECRET_RIDE_TO_BOOKING:?}
      GARAGE_BASE_URL: http://garage-service:8083
      INTERNAL_SECRET_RIDE_TO_GARAGE: ${INTERNAL_SECRET_RIDE_TO_GARAGE:?}
      NOTIFICATION_BASE_URL: http://notification-service:8088
      INTERNAL_SECRET_RIDE_TO_NOTIFICATION: ${INTERNAL_SECRET_RIDE_TO_NOTIFICATION:?}
    secrets: [jwt_public]
    ports: ["127.0.0.1:8086:8086"]

  plan-service:
    <<: *java-service
    build:
      context: .
      args: {MODULE: services/plan-service}
    depends_on:
      mysql: {condition: service_healthy}
    environment:
      SERVER_PORT: 8087
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60 -XX:InitialRAMPercentage=15
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/weride_plan?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: weride_plan
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD_PLAN:?}
      JWT_PUBLIC_KEY_LOCATION: file:/run/secrets/jwt_public
    secrets: [jwt_public]
    ports: ["127.0.0.1:8087:8087"]

  notification-service:
    <<: *java-service
    build:
      context: .
      args: {MODULE: services/notification-service}
    depends_on:
      mysql: {condition: service_healthy}
    environment:
      SERVER_PORT: 8088
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60 -XX:InitialRAMPercentage=15
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/weride_notification?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: weride_notification
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD_NOTIFICATION:?}
      JWT_PUBLIC_KEY_LOCATION: file:/run/secrets/jwt_public
      INTERNAL_SECRET_IAM_TO_NOTIFICATION: ${INTERNAL_SECRET_IAM_TO_NOTIFICATION:?}
      INTERNAL_SECRET_BOOKING_TO_NOTIFICATION: ${INTERNAL_SECRET_BOOKING_TO_NOTIFICATION:?}
      INTERNAL_SECRET_RIDE_TO_NOTIFICATION: ${INTERNAL_SECRET_RIDE_TO_NOTIFICATION:?}
    secrets: [jwt_public]
    ports: ["127.0.0.1:8088:8088"]

  api-gateway:
    <<: *java-service
    build:
      context: .
      args: {MODULE: api-gateway}
    depends_on:
      iam-service: {condition: service_healthy}
    environment:
      SERVER_PORT: 8080
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60 -XX:InitialRAMPercentage=15
      JWT_PUBLIC_KEY_LOCATION: file:/run/secrets/jwt_public
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?}
      WERIDE_SWAGGER_ENABLED: "true"
      INTERNAL_SECRET_API_GATEWAY_TO_IAM: ${INTERNAL_SECRET_API_GATEWAY_TO_IAM:?}
      IAM_BASE_URL: http://iam-service:8081
      PROFILE_BASE_URL: http://profile-service:8082
      GARAGE_BASE_URL: http://garage-service:8083
      LOCATION_BASE_URL: http://location-service:8084
      BOOKING_BASE_URL: http://booking-service:8085
      RIDE_BASE_URL: http://ride-service:8086
      PLAN_BASE_URL: http://plan-service:8087
      NOTIFICATION_BASE_URL: http://notification-service:8088
    secrets: [jwt_public]
    ports: ["127.0.0.1:8080:8080"]

  frontend:
    profiles: [web]
    build: ${FRONTEND_PATH:-../frontend-main/frontend-main}
    restart: unless-stopped
    depends_on:
      api-gateway: {condition: service_healthy}
    ports: ["127.0.0.1:4200:80"]
    networks: [app-net]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ | grep -q '<app-root'"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  app-net:
volumes:
  mysql_data:
secrets:
  jwt_public:
    file: ${JWT_PUBLIC_KEY_FILE:?}
  jwt_private:
    file: ${JWT_PRIVATE_KEY_FILE:?}
